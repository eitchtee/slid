  <rect x="19.9" y="5.9" width="6.2" height="6.2" rx="1.4" fill="#f4efe6"/>
  <rect x="5.9" y="12.9" width="6.2" height="6.2" rx="1.4" fill="#4f8a5b"/>
  <rect x="12.9" y="12.9" width="6.2" height="6.2" rx="1.4" fill="#4f8a5b"/>
  <rect x="19.9" y="12.9" width="6.2" height="6.2" rx="1.4" fill="#4f8a5b"/>
  <rect x="5.9" y="19.9" width="6.2" height="6.2" rx="1.4" fill="#f4efe6"/>
