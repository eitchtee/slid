[project]
name = "slid"
version = "0.1.0"
description = "A daily word sliding puzzle"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httptools>=0.8.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "watchfiles>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
